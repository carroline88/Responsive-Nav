<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Responsiv navigationsmeny med hamburgermeny för mobila enheter">
  <title>Responsive Navigation</title>

  <!-- Länk till CSS i styles-mappen -->
  <link rel="stylesheet" href="styles/style.css">

  <!-- Ikoner från Font Awesome för att få hamburgermenysymbolen (fa-bars) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <header>
    <!-- Semantisk nav-tagg med ett unikt id -->
    <nav class="topnav" id="myTopnav">
      <a href="#home" class="active">Hem</a>
      <a href="#news">Nyheter</a>
      <a href="#contact">Kontakt</a>
      <a href="#about">Om oss</a>

      <!-- Hamburgarikon som bara visas på mindre skärmar -->
      <a href="javascript:void(0);" class="icon" onclick="toggleMenu()">
        <i class="fa fa-bars"></i>
      </a>
    </nav>
  </header>

  <main class="content">
    <h1>Responsiv Navigering</h1>
    <p>Detta är ett exempel på en responsiv topnav.</p>
    <p>Dra ihop fönstret till mobilvy för att se hur menyn förvandlas till en hamburgermeny!</p>
  </main>

  <!-- JavaScript direkt i HTML-filen enligt lektionsgenomgången -->
  <script>
    function toggleMenu() {
      var x = document.getElementById("myTopnav");
      if (x.className === "topnav") {
        x.className += " responsive";
      } else {
        x.className = "topnav";
      }
    }
  </script>

</body>
</html>
